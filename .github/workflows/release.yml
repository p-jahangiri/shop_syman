name: Release tagged version
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: production-release
  # A migration must never be cancelled by another tag.
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      image-prefix: ${{ steps.release.outputs.image-prefix }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: release
        name: Validate immutable release identity
        env:
          STOREFRONT_PUBLIC_URL: ${{ vars.STOREFRONT_PUBLIC_URL }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Use exactly vMAJOR.MINOR.PATCH.' >&2; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python3 - <<'PY'
          import os, re
          value = os.environ['STOREFRONT_PUBLIC_URL']
          if not re.fullmatch(r'https://(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}', value):
              raise SystemExit('Set repository variable STOREFRONT_PUBLIC_URL to the exact HTTPS storefront origin (no trailing slash).')
          PY
          echo "image-prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  frontend:
    needs: validate
    uses: ./.github/workflows/storefront.yml
  backend:
    needs: validate
    uses: ./.github/workflows/backend.yml

  package:
    needs: [validate, frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish API
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ needs.validate.outputs.image-prefix }}-api:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=release-api
          cache-to: type=gha,mode=max,scope=release-api
      - name: Build and publish storefront
        id: storefront
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/storefront/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ needs.validate.outputs.image-prefix }}-storefront:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=release-storefront
          cache-to: type=gha,mode=max,scope=release-storefront
      - name: Build and publish admin
        id: admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          build-args: VITE_STOREFRONT_URL=${{ vars.STOREFRONT_PUBLIC_URL }}
          tags: ${{ needs.validate.outputs.image-prefix }}-admin:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=release-admin
          cache-to: type=gha,mode=max,scope=release-admin
      - name: Package deployable immutable manifest
        env:
          IMAGE_PREFIX: ${{ needs.validate.outputs.image-prefix }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          STOREFRONT_DIGEST: ${{ steps.storefront.outputs.digest }}
          ADMIN_DIGEST: ${{ steps.admin.outputs.digest }}
          STOREFRONT_PUBLIC_URL: ${{ vars.STOREFRONT_PUBLIC_URL }}
        run: |
          set -euo pipefail
          mkdir -p release-bundle/scripts release-bundle/deploy/nginx
          cp compose.production.yaml compose.api.production.yaml release-bundle/
          cp scripts/{deploy-production.sh,production_release.py} release-bundle/scripts/
          cp deploy/nginx/{default,api}.conf.template release-bundle/deploy/nginx/
          cp deploy/.env*.production.example release-bundle/deploy/
          cp -R deploy/backend release-bundle/deploy/
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          prefix = os.environ['IMAGE_PREFIX']
          release = {
              'schema': 1, 'tag': os.environ['GITHUB_REF_NAME'],
              'revision': os.environ['GITHUB_SHA'], 'repository': os.environ['GITHUB_REPOSITORY'].lower(),
              'platform': 'linux/amd64', 'storefront_url': os.environ['STOREFRONT_PUBLIC_URL'],
              'images': {name: f'{prefix}-{name}@{os.environ[name.upper() + "_DIGEST"]}'
                         for name in ('api', 'storefront', 'admin')},
          }
          Path('release-bundle/release.json').write_text(json.dumps(release, indent=2) + '\n')
          PY
          python3 scripts/production_release.py manifest release-bundle/release.json
          cd release-bundle
          find . -type f -print0 | sort -z | xargs -0 sha256sum > ../SHA256SUMS
          mv ../SHA256SUMS .
          tar -czf ../sayman-release.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: production-bundle-${{ github.ref_name }}
          path: sayman-release.tar.gz
          retention-days: 90
          if-no-files-found: error
      - name: Record package result
        run: |
          echo 'Three linux/amd64 images and the digest-pinned release bundle are ready.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Host deployment runs only when repository variable PRODUCTION_DEPLOY_ENABLED is true.' >> "$GITHUB_STEP_SUMMARY"

  deploy-linux:
    needs: package
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: production-bundle-${{ github.ref_name }}
      - name: Deploy over host-key-pinned SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/opt/sayman' }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ && "$SSH_PORT" -gt 0 && "$SSH_PORT" -le 65535 ]]
          [[ "$DEPLOY_ROOT" =~ ^/[A-Za-z0-9_/-]+$ && "$DEPLOY_ROOT" != / ]]
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]]
          mkdir -p "$RUNNER_TEMP/ssh"
          key="$RUNNER_TEMP/ssh/deploy-key"
          known="$RUNNER_TEMP/ssh/known_hosts"
          trap 'rm -f "$key" "$known"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known"
          ssh_opts=(-i "$key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" -o BatchMode=yes -o ConnectTimeout=15)
          release_dir="$DEPLOY_ROOT/releases/$GITHUB_REF_NAME-${GITHUB_SHA:0:12}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh "${ssh_opts[@]}" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p -- '$release_dir'"
          scp "${ssh_opts[@]}" -P "$SSH_PORT" sayman-release.tar.gz "$SSH_USER@$SSH_HOST:$release_dir/release.tar.gz"
          ssh "${ssh_opts[@]}" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "tar -xzf '$release_dir/release.tar.gz' -C '$release_dir' && cd '$release_dir' && sha256sum --check --status SHA256SUMS && bash scripts/deploy-production.sh '$DEPLOY_ROOT'"

  deploy-vercel:
    needs: [validate, frontend, backend, package, deploy-linux]
    if: >-
      always() && vars.VERCEL_DEPLOY_ENABLED == 'true' &&
      needs.validate.result == 'success' && needs.frontend.result == 'success' &&
      needs.backend.result == 'success' && needs.package.result == 'success' &&
      (needs.deploy-linux.result == 'success' || needs.deploy-linux.result == 'skipped')
    uses: ./.github/workflows/vercel-release.yml
    secrets: inherit
