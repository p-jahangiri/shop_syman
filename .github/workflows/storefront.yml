name: Storefront
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tools/lint --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm audit --prefix tools/lint --audit-level=moderate
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:admin-contract
      - run: npm run test:admin-server
      - run: npm run typecheck
      - run: npm run typecheck:admin
      - run: npm run build:admin
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - run: python3 scripts/verify-storefront-build.py
