name: Storefront
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tools/lint --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm audit --prefix tools/lint --audit-level=moderate
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:admin-contract
      - run: npm run test:admin-server
      - run: npm run typecheck
      - run: npm run typecheck:admin
      - run: npm run build:admin
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - run: python3 scripts/verify-storefront-build.py
