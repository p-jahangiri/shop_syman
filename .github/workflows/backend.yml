name: Backend and SQL
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOTNET_GCHeapHardLimit: '0xC0000000'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: backend/**/packages.lock.json
      - run: dotnet restore backend/Shop.sln --locked-mode
      - run: dotnet restore backend/tests/Shop.SqlTests --locked-mode
      - run: dotnet package list --project backend/src/Shop.Api/Shop.Api.csproj --vulnerable --include-transitive --format json --no-restore > nuget-audit.json
      - name: Reject known vulnerable backend packages
        run: python3 -c "import json; d=json.load(open('nuget-audit.json')); assert not d.get('logs'), 'NuGet audit unavailable'; assert not any(f.get('topLevelPackages') or f.get('transitivePackages') for p in d.get('projects',[]) for f in p.get('frameworks',[])), 'Vulnerable NuGet package'"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: dotnet test backend/tests/Shop.Tests --no-restore --disable-build-servers -m:1
      - run: python3 -m unittest discover -s scripts -p 'test_production_release.py'
      - run: python3 scripts/init-local-env.py
      - id: sql
        run: docker compose --profile backend up -d --wait --wait-timeout 150 sqlserver
      - run: dotnet build backend/tests/Shop.SqlTests --no-restore --disable-build-servers -m:1 -p:UseSharedCompilation=false
      - run: python3 scripts/test-sql-local.py --no-build
      - if: always() && steps.sql.outcome == 'success'
        run: python3 scripts/verify-sql-test-cleanup.py
      - if: always()
        run: docker compose --profile backend down --volumes --remove-orphans
