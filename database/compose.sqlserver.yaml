name: sayman-local
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU22-ubuntu-22.04@sha256:db9a8fe3098b7e8bbde41106bdc7caee942e97124e5fdb71b872ca208de3092d
    platform: linux/amd64
    ports: ["127.0.0.1:11433:1433"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in the environment file}
      SQLCMDPASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in the environment file}
      MSSQL_MEMORY_LIMIT_MB: "1536"
    volumes: ["sql-data:/var/opt/mssql"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 12
volumes:
  sql-data:
